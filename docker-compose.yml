# One container per city.  Run with:  docker compose up --build
# Output lands in ./run-docker/.
#
# To add a city: add a line to docker/cities.txt and a matching service below
# (the city number in `command` is its line number in cities.txt).

x-city: &city
  build: .
  volumes:
    - ./run-docker:/out
    - ./fluvars.in:/out/fluvars.in:ro
    - ./docker/cities.txt:/etc/swn/cities.txt:ro

services:
  city1:
    <<: *city
    command: ["1", "1", "/etc/swn/cities.txt"]   # seed, city number, cities file
  city2:
    <<: *city
    command: ["1", "2", "/etc/swn/cities.txt"]
  city3:
    <<: *city
    command: ["1", "3", "/etc/swn/cities.txt"]
  city4:
    <<: *city
    command: ["1", "4", "/etc/swn/cities.txt"]
